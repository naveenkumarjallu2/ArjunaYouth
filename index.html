<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arujuna Youth - Ganesh Chanda Collection</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<header class="hero">

  <img src="assets/ganesh-banner.jpg" class="banner">

  <div class="overlay">
    <h1>🙏 Arujuna Youth 🙏</h1>
    <p>Ganesh Chanda Collection 2026</p>
  </div>

</header>

<div class="container">

<h2>Donor Details</h2>

<form id="donationForm">

<label>Donor Name</label>
<input type="text" id="name" required>

<label>Donor Surname</label>
<input type="text" id="surname" required>

<label>Mobile Number</label>
<input type="tel" id="mobile" maxlength="10" required>

<div class="toggle-row">

<label>WhatsApp?</label>

<input type="checkbox" id="whatsapp">

</div>

<label>Address</label>
<textarea id="address" rows="3" required></textarea>

<label>Donation Amount (₹)</label>
<input type="number" id="amount" required>

<label>Payment Type</label>

<div class="radio">

<label><input type="radio" name="payment" value="Cash" checked> Cash</label>

<label><input type="radio" name="payment" value="Online"> Online</label>

</div>

<div id="onlineSection" class="hidden">

    <h3>Online Payment</h3>

    <p class="payment-info">
        Tap the button below to pay directly using your UPI app.
    </p>

    <button
    type="button"
    id="upiButton"
    class="payButton"
>
    💳 Pay Now
</button>

    <p class="small-text">
        Google Pay, PhonePe, Paytm, BHIM and other UPI apps
        may open automatically.
    </p>

</div>

<button type="submit" class="submitBtn">
Submit Donation
</button>

</form>

<div id="message"></div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="js/supabase.js"></script>
<script src="js/payment.js"></script>
<script src="js/app.js"></script>

</body>
</html>
