<!--index.html-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arujuna Youth - Ganesh Chanda Collection</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<header class="hero">

    <img src="assets/back.jpg" class="banner">

    <div class="overlay">

        <div class="festival-chip">
            ✨ Ganesh Chaturthi 2026 ✨
        </div>

        <h1>🙏 Arjuna Youth 🙏</h1>

        <span class="hero-tag">
            ✨Ganesh Chanda Collection ✨
        </span>

    </div>

</header>

<div class="container glass-card">

    <div class="title-area">

        <h2>Donation Details</h2>

    </div>

    <form id="donationForm">

        <!-- Donor Name -->
        <div class="input-box">
            <span>👤</span>
            <input
                    type="text"
                    id="name"
                    placeholder="Enter Donor Name"
                    required
            >
        </div>

        <!-- Donor Surname -->
        <div class="input-box">
            <span>🪷</span>
            <input
                    type="text"
                    id="surname"
                    placeholder="Enter Surname"
                    required
            >
        </div>

        <!-- Mobile -->
        <div class="input-box">
            <span>📞</span>
            <input
                    type="tel"
                    id="mobile"
                    maxlength="10"
                    placeholder="Enter 10-digit Mobile Number"
                    required
            >
        </div>

        <!-- Address -->
        <div class="input-box textarea-box">
            <span>📍</span>
            <textarea
                    id="address"
                    rows="3"
                    placeholder="Enter your Address"
                    required
            ></textarea>
        </div>

        <!-- Amount -->
        <div class="amount-card">
            <label>Donation Amount</label>

            <div class="amount-input">
                <span>₹</span>
                <input
                        type="number"
                        id="amount"
                        placeholder="Enter Donation Amount"
                        required
                >
            </div>
        </div>

        <!-- Payment Selection -->

        <label class="section-title">
            Select Payment Method
        </label>

        <div class="payment-selector">

            <label class="payment-card cash-card">

                <input type="radio" name="payment" value="Cash" checked>

                <div>
                    💵 Cash
                </div>

            </label>

            <label class="payment-card online-card">

                <input type="radio" name="payment" value="Online">

                <div>
                    📱 UPI / Razorpay
                </div>

            </label>

        </div>

        <!-- Online Payment -->

        <div id="onlineSection" class="hidden">

            <div class="online-card-box">

                <h3>Pay Securely with Razorpay</h3>

                <p>
                    Google Pay • PhonePe • Paytm • BHIM • UPI Apps
                </p>

                <button type="button" id="upiButton" class="payButton">
                    💳 Pay Now
                </button>

            </div>

        </div>

        <!-- Cash Submit -->

        <button type="submit" id="cashSubmitBtn" class="submitBtn">
            Submit Cash Donation
        </button>

    </form>

    <div id="message"></div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="js/supabase.js"></script>
<script src="js/payment.js"></script>
<script src="js/app.js"></script>

</body>
</html>
